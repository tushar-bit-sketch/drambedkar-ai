version: '3.8'

# ==============================================================================
# SIH26096 — Digital Heritage Archive for Memorials, Manuscripts & Ambedkar
# PRODUCTION DOCKER COMPOSE ARCHITECTURE (Oracle Cloud Always Free VM)
# ==============================================================================
# Services:
# - PostgreSQL 16 with native pgvector extension (pgvector/pgvector:pg16)
# - Redis 7 Ephemeral Cache
# - FastAPI Institutional Backend (4 Uvicorn workers)
# - Nginx Reverse Proxy with TLS termination, Rate Limiting & SPA routing
# - Persistent Named Volumes for database, cache, and master archival storage
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 + pgvector Database Engine (Private to internal network)
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ambedkar_archive_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-archive_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archive_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-ambedkar_archive}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Bound strictly to internal loopback for local admin/backup tools; never exposed to internet
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-archive_user} -d ${POSTGRES_DB:-ambedkar_archive}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - archive_internal

  # ----------------------------------------------------------------------------
  # Redis 7 Ephemeral Cache & Task Queue (Private to internal network)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ambedkar_archive_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-archive_redis_pass_2026}
    volumes:
      - redis_data:/data
    # Bound strictly to internal loopback
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-archive_redis_pass_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - archive_internal

  # ----------------------------------------------------------------------------
  # FastAPI Institutional Backend Service (Private to internal network)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ambedkar_archive_backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - PROJECT_NAME=Dr. Ambedkar Institutional Digital Heritage Archive
      - ARCHIVE_PHASE=PHASE_10_FINAL_INTEGRATION
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-archive_user}:${POSTGRES_PASSWORD:-archive_secure_password_2026}@postgres:5432/${POSTGRES_DB:-ambedkar_archive}
      - SECRET_KEY=${SECRET_KEY:-institutional-vault-production-secret-key-phase10-change-in-production}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-["http://localhost","https://ambedkar-archive.vercel.app"]}
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_MODEL=${HF_MODEL:-BAAI/bge-m3}
      - HF_BASE_URL=${HF_BASE_URL:-https://router.huggingface.co/v1}
      - VECTOR_BACKEND=${VECTOR_BACKEND:-PGVECTOR}
      - OBJECT_STORAGE_ENDPOINT=${OBJECT_STORAGE_ENDPOINT:-}
      - OBJECT_STORAGE_BUCKET=${OBJECT_STORAGE_BUCKET:-}
      - OBJECT_STORAGE_ACCESS_KEY=${OBJECT_STORAGE_ACCESS_KEY:-}
      - OBJECT_STORAGE_SECRET_KEY=${OBJECT_STORAGE_SECRET_KEY:-}
      - SECURITY_HEADERS_ENABLED=true
      - RATE_LIMIT_ENABLED=true
      - KIOSK_IDLE_TIMEOUT_SECONDS=120
      - KIOSK_WARNING_SECONDS=15
      - KIOSK_HEARTBEAT_INTERVAL_SECONDS=30
      - STORAGE_DIR=/app/storage/uploads
      - AUDIO_STORAGE_DIR=/app/storage/audio
      - TRANSLATION_STORAGE_DIR=/app/storage/translations
    volumes:
      - storage_uploads:/app/storage/uploads
      - storage_derivatives:/app/storage/derivatives
      - storage_media:/app/storage/media
      - storage_audio:/app/storage/audio
      - storage_packages:/app/storage/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health/live\")'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - archive_internal

  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy, TLS Termination & Static File Caching (PUBLIC FACING)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: ambedkar_archive_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - storage_derivatives:/var/www/derivatives:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - archive_internal

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  storage_uploads:
    driver: local
  storage_derivatives:
    driver: local
  storage_media:
    driver: local
  storage_audio:
    driver: local
  storage_packages:
    driver: local
  nginx_logs:
    driver: local

networks:
  archive_internal:
    driver: bridge
