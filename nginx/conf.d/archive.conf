upstream backend_api {
    server backend:8000;
    keepalive 32;
}

# HTTP Server — Reverse Proxy & Redirect
server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # Institutional Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(self), microphone=(self)" always;

    # 1. Frontend Single Page Application (React 19 / Vite Broadsheet)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static production assets (CSS, JS, Fonts, Images)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # 2. Backend REST API Endpoints (/api/v1/* and /api/*)
    location /api/ {
        limit_req zone=api_general burst=30 nodelay;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Extended timeouts for deep OCR processing and LLM RAG inference
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Enable unbuffered streaming for token-by-token RAG responses
        proxy_buffering off;
    }

    # 3. System Probes & Health Checks
    location /health/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # 4. Public Read-Only Media Derivatives Cache
    location /storage/derivatives/ {
        alias /var/www/derivatives/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
