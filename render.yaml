services:
  # ----------------------------------------------------------------------------
  # FastAPI Institutional Backend Service — Render Free Tier Ready
  # ----------------------------------------------------------------------------
  - type: web
    name: ambedkar-archive-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./archive_phase1.db
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: '["https://frontend-kappa-six-80.vercel.app","https://drambedkar-ai.vercel.app","http://localhost:5173","http://localhost:3000"]'
      - key: HF_TOKEN
        sync: false
      - key: HF_MODEL
        value: meta-llama/Llama-3.1-8B-Instruct
      - key: HF_BASE_URL
        value: https://router.huggingface.co/v1
      - key: VECTOR_BACKEND
        value: sqlite_dev_fallback
      - key: SECURITY_HEADERS_ENABLED
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
